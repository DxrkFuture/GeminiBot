info:
  welcome: |
    <b>Привет!</b>
    
    🤖 <b>Я - многофункциональный ИИ-бот.</b> Умею работать с текстом, картинками и даже больше!
    ❔ Чтобы <b>задать мне вопрос</b> или пообщаться, просто напиши сюда в чат.
    👥 Можешь даже <b>добавить меня в свою группу</b>, чтобы я мог помогать всем! Чтобы обратиться ко мне, достаточно упомянуть меня.
    
    ⚙️ У меня есть множество <b>команд и параметров</b>. Их можно посмотреть в /help и /settings соответственно.
    💬 Если хочешь быстро сменить тему - можешь <b>очистить мою память</b> командой /reset
    
    📝 Учти, что я <b>сохраняю в свою память каждое сообщение</b>, что вижу. Старайся не отправлять сюда конфиденциальную информацию.
    🤔 Я всё ещё учусь и могу допускать ошибки. Пожалуйста, не верь всему следно.
  command:
    settings: "⚙️ <b>Доступные параметры бота:</b> \n"
    settings_parameter: "\n<code>{parameter}</code> - {value} "
    settings_footer: |


      <b>Для подробностей по параметру:</b> /settings <i>[параметр]</i>
      💾 <b>Установить новое значение:</b> /set <i>[параметр] [значение]</i>

    settings_detail: |

      ⚙️ <b>Параметр</b> <code>{parameter}</code>:
      <i>{description}</i>
      
      ❔ <b>Значения:</b>
      - <b>Нынешнее:</b> <i>{current_value}</i>
      - Стандартное: {default_value}

    settings_accepted_values: "- Допустимые: {accepted_values}"
    settings_protected: |
    

      ⚠️ <b>Этот параметр защищён - его могут менять только администраторы бота.</b>
    
    settings_extra_flags: |


      ❓ <b>Обнаружены лишние флаги для команды /settings.</b> Нужно поставить новое значение? Используйте команду /set:
      <code>{set_command}</code>

